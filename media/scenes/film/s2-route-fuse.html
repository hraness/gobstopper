<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Film shot 2: the proxy, then the fuse</title>
</head>
<body>
<script>
// film:begin (generated from _film.js by sync.ts; do not edit here)
// Shared film runtime, inlined into every scenes/film/*.html between the generated-block
// marker lines by `bun media/scenes/film/sync.ts` (run it after editing this file;
// `--check` fails when a scene is out of date). render.ts copies a scene's HTML as is, so
// each shot must be self-contained.
//
// Every time in scene code is ABSOLUTE film time in seconds (0–75), the same clock as
// shots.json. Film.run converts to the shot's local scene clock. Visual state is a pure
// function of time: tweens go through stage.timeline() (one ease per segment) and
// per-frame text (counters, typing, carets) goes through ctx.frame().
const Film = (() => {
  const api = SlopcameraOverlay;
  const P = api.parameters;
  const shot = P.data.shot;
  const offset = typeof P.timeOffsetSeconds === "number" ? P.timeOffsetSeconds : 0;
  const frames = [];
  // Registered synchronously, before the first frame (registration closes there).
  api.onFrame((f) => {
    const t = shot.start + f.timeMs / 1000 + offset;
    for (const fn of frames) fn(t);
  });

  const W = 1920;
  const H = 1080;
  const X = 120; // left and right margin
  const BEAT = { x: 120, y: 144, w: 1680 };
  const LID_Y = 432;
  const SLAB = { h: 44, gap: 6, pitch: 50, r: 12 };
  const EASE = {
    enter: "cubic-bezier(.2,.8,.2,1)",
    exit: "cubic-bezier(.4,0,1,1)",
    fuse: "cubic-bezier(.65,0,.35,1)",
    drop: "cubic-bezier(.55,0,.85,.35)",
    linear: "linear",
  };

  const ARM_VAR = { tail0: "var(--tail0)", tail40: "var(--tail40)", no_proxy: "var(--noproxy)" };
  // Arm colours are slab fills. Text set in an arm colour uses a lighter tint of it, so it
  // reaches at least 6.5:1 on the night background (the tail 0 fill alone is 3.9:1); the
  // tints are matched in lightness so no arm's label reads dimmer than another's.
  const ARM_TEXT = { tail0: "#7c9bff", tail40: "#e3924d", no_proxy: "#2fbf98" };
  for (const [id, v] of Object.entries(ARM_TEXT)) document.documentElement.style.setProperty(`--${id === "no_proxy" ? "noproxy" : id}-text`, v);

  // timing:begin (film.test.ts evaluates this block)
  const XFADE = 0.4;
  /**
   * When beat i of a shot is visible, in absolute film seconds. Headings share one position,
   * so a cut never dissolves two of them: the last beat of a shot is gone by the shot's end
   * (before its handle and the cross-fade), and the first beat of the next shot starts
   * halfway through the cross-fade. Beats inside a shot hand over at the beat boundary.
   * The final beat of the film never fades.
   */
  function beatWindow(shot, i, lastShot) {
    const b = shot.beats[i];
    const first = i === 0;
    const last = i === shot.beats.length - 1;
    const inAt = first && shot.start > 0 ? b.start + XFADE / 2 : b.start;
    return {
      in: { at: inAt, dur: first && shot.start > 0 ? 0.3 : 0.4, dy: first && shot.start > 0 ? 0 : 16 },
      out: last && lastShot ? null : { end: last ? shot.end : b.end, dur: 0.25 },
    };
  }
  // timing:end

  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

  function run(build) {
    Gob.scene({ palette: "night", scale: "film" }, async (st) => {
      const segs = [];
      const local = (a) => Math.round((a - shot.start) * 1000) / 1000;
      const ctx = {
        st, shot, W, H, X, BEAT, LID_Y, SLAB, EASE, F: Gob.F, data: st.params.data,
        /** One tween on absolute film time. */
        seg(el, from, to, a0, a1, ease) {
          segs.push({ el, from, to, t0: local(a0), t1: local(a1), ease: ease || EASE.enter });
          return el;
        },
        fadeIn(el, a0, o = {}) {
          const d = o.dur ?? 0.4;
          const dy = o.dy ?? 16;
          const dx = o.dx ?? 0;
          return ctx.seg(el, { opacity: 0, transform: `translate(${dx}px, ${dy}px)` },
            { opacity: 1, transform: "translate(0px, 0px)" }, a0, a0 + d, o.ease || EASE.enter);
        },
        fadeOut(el, aEnd, o = {}) {
          const d = o.dur ?? 0.25;
          const dy = o.dy ?? -8;
          return ctx.seg(el, { opacity: 1, transform: "translate(0px, 0px)" },
            { opacity: 0, transform: `translate(0px, ${dy}px)` }, aEnd - d, aEnd, EASE.exit);
        },
        frame(fn) { frames.push(fn); },
        div(css, parent) { return st.el("div", css, parent); },
        svg(css, parent) {
          const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          s.setAttribute("width", String(W));
          s.setAttribute("height", String(H));
          s.setAttribute("viewBox", `0 0 ${W} ${H}`);
          s.style.cssText = `position:absolute;left:0;top:0;overflow:visible;${css || ""}`;
          (parent || st.root).appendChild(s);
          return s;
        },
        path(svg, d, attrs) {
          const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
          p.setAttribute("d", d);
          for (const [k, v] of Object.entries(attrs || {})) p.setAttribute(k, String(v));
          svg.appendChild(p);
          return p;
        },
        /** Stroke-draw a path (pathLength 1) between a0 and a1. */
        draw(p, a0, a1, ease) {
          p.setAttribute("pathLength", "1");
          p.style.strokeDasharray = "1 1";
          return ctx.seg(p, { strokeDashoffset: 1 }, { strokeDashoffset: 0 }, a0, a1, ease || EASE.linear);
        },
        /** Reveal an element left to right with clip-path. */
        wipe(el, a0, a1, ease, bleed = 0) {
          const b = `${-bleed}px`;
          return ctx.seg(el, { clipPath: `inset(${b} 100% ${b} ${b})` }, { clipPath: `inset(${b} 0% ${b} ${b})` }, a0, a1, ease || EASE.linear);
        },
        /** Count a number up with an ease-out; fmt(value) returns the string; final is exact. */
        count(el, a0, a1, to, fmt, final) {
          ctx.frame((t) => {
            const p = clamp01((t - a0) / (a1 - a0));
            el.textContent = p >= 1 ? final : fmt(to * easeOutCubic(p));
          });
        },
        /** Type text between a0 and a1 (linear), with a caret that blinks once typing stops. */
        type(el, text, a0, a1, caret) {
          ctx.frame((t) => {
            const n = Math.floor(clamp01((t - a0) / (a1 - a0)) * text.length + 1e-9);
            el.textContent = text.slice(0, n);
            if (caret) {
              const typing = t >= a0 && t < a1;
              const on = t >= a0 - 0.6 && (typing || Math.floor((t - a1) * 2) % 2 === 0);
              caret.style.opacity = on ? "1" : "0";
            }
          });
        },
        /** Standard beat text for this shot; `skip` lists beat numbers the scene draws itself. */
        beats(skip = []) {
          const nodes = {};
          shot.beats.forEach((b, i) => {
            if (skip.includes(b.n)) return;
            const el = st.text("beat", b.text, { x: BEAT.x, y: BEAT.y, w: BEAT.w });
            const w = beatWindow(shot, i, shot.end >= 75);
            ctx.fadeIn(el, w.in.at, { dy: w.in.dy, dur: w.in.dur });
            if (w.out) ctx.fadeOut(el, w.out.end, { dur: w.out.dur });
            nodes[b.n] = el;
          });
          return nodes;
        },
        /** The persistent lower-third, drawn identically in every shot that overlaps its window. */
        lowerThird() {
          const lt = P.data.lowerThird;
          const end = shot.end + (shot.handle || 0);
          if (!lt || end <= lt.from || shot.start >= lt.to) return null;
          // `hidden` lists [from, to] windows (shot boundaries) where the benchmark scope line
          // does not apply, such as the replayed session in s4: it leaves before that cut.
          const gaps = lt.hidden || [];
          if (gaps.some(([a, b]) => shot.start >= a && shot.end <= b)) return null;
          const el = st.lowerThird(lt.text);
          const outAt = Math.min(lt.to, ...gaps.map(([a]) => a).filter((a) => a > shot.start && a <= end));
          if (lt.from >= shot.start) ctx.seg(el, { opacity: 0 }, { opacity: 1 }, lt.from, lt.from + 0.4, EASE.enter);
          else if (outAt <= end) ctx.seg(el, { opacity: 1 }, { opacity: 1 }, shot.start, shot.start + 0.01, EASE.linear);
          if (outAt <= end) ctx.seg(el, { opacity: 1 }, { opacity: 0 }, outAt - 0.25, outAt, EASE.exit);
          return el;
        },
        /** The threshold lid, always at y = 432 and x 120–1800. */
        lid(label = "threshold") {
          return st.lid(LID_Y, label, { x0: X, x1: W - X });
        },
        /** Wipe the lid in left to right; the bleed keeps its label (above the 2px line) unclipped. */
        drawLid(lid, a0, a1, ease) {
          return ctx.wipe(lid, a0, a1, ease || EASE.enter, 56);
        },
        /** A stack of slabs from `baseline` upward; returns the slab elements, bottom first. */
        stack(kinds, x, w, baseline, o = {}) {
          return kinds.map((kind, i) => {
            const y = baseline - (i + 1) * SLAB.h - i * SLAB.gap;
            return st.slab(kind, { x, y, w, h: SLAB.h }, undefined, { tone: o.tone, radius: SLAB.r, parent: o.parent });
          });
        },
        /** An arm's CSS colour. */
        arm(id) { return ARM_VAR[id]; },
        /** The text tint of an arm's colour (for labels; fills keep arm()). */
        armText(id) { return `var(--${id === "no_proxy" ? "noproxy" : id}-text)`; },
        /** The arm marker (SPEC §1.1): circle r5, square 8, diamond 9, scaled by k. */
        marker(id, cx, cy, k = 2, parent) {
          const size = id === "tail0" ? 10 : id === "tail40" ? 8 : 9;
          const s = size * k;
          const m = st.el("div", `position:absolute;left:${cx - s / 2}px;top:${cy - s / 2}px;width:${s}px;height:${s}px;background:${ARM_VAR[id]}`, parent);
          if (id === "tail0") m.style.borderRadius = "50%";
          if (id === "no_proxy") m.style.rotate = "45deg";
          return m;
        },
        slabY(baseline, i) { return baseline - (i + 1) * SLAB.h - i * SLAB.gap; },
        label(role, s, box, o) { return st.text(role, s, box, o); },
      };
      await build(ctx);
      st.timeline(segs);
    });
  }
  return { run, W, H, X, BEAT, LID_Y, SLAB, EASE };
})();
// film:end

// s2 (12.0–21.0): the route pills slide in, lift away; a nine-slab stack rises through the
// lid, the middle five fuse into one summary (17.4–18.0), and the stack drops under the lid.
Film.run((c) => {
  const { st, EASE, SLAB, LID_Y } = c;
  c.beats();

  // ---- Beat 4: the route. Pills measured after fonts load, centred as one row.
  const row = c.div("position:absolute;left:0;top:0;width:1920px;height:1080px");
  const PILL_Y = 540;
  const PILL_H = 92;
  const pill = (text, mono, edge) => {
    const p = st.el("div", `position:absolute;top:${PILL_Y}px;height:${PILL_H}px;display:flex;align-items:center;padding:0 40px;border-radius:${PILL_H / 2}px;background:var(--panel);box-shadow:inset 0 0 0 ${edge ? 3 : 1.5}px ${edge ? "var(--tail0)" : "color-mix(in oklab, var(--slab-edge) 55%, transparent)"};white-space:nowrap`, row);
    const t = c.label(mono ? "mono" : "label", text, { x: 0, y: 0 }, { parent: p, weight: 500 });
    t.style.position = "relative";
    return p;
  };
  const pills = [pill("Claude Code", false, false), pill("gobstopper proxy · 127.0.0.1:8260", true, true), pill("model provider", false, false)];
  const GAP = 132;
  const widths = pills.map((p) => st.measure(p).width);
  let x = Math.round((1920 - (widths.reduce((a, b) => a + b, 0) + GAP * 2)) / 2);
  const xs = [];
  pills.forEach((p, i) => { p.style.left = `${x}px`; xs.push(x); x += widths[i] + GAP; });
  const arrows = c.svg("", row);
  const arrowPaths = [0, 1].map((i) => {
    const x0 = xs[i] + widths[i] + 22;
    const x1 = xs[i + 1] - 22;
    const y = PILL_Y + PILL_H / 2;
    return c.path(arrows, `M${x0},${y} H${x1} M${x1 - 12},${y - 10} L${x1},${y} L${x1 - 12},${y + 10}`,
      { fill: "none", stroke: "var(--ink-2)", "stroke-width": 2.5, "stroke-linecap": "round", "stroke-linejoin": "round" });
  });
  // The middle pill lands at 12.8 (the place tone); its neighbours flank it.
  c.fadeIn(pills[0], 12.3, { dx: -28, dy: 0, dur: 0.45 });
  c.fadeIn(pills[1], 12.4, { dx: 0, dy: 20, dur: 0.4 });
  c.fadeIn(pills[2], 12.9, { dx: 28, dy: 0, dur: 0.45 });
  c.draw(arrowPaths[0], 13.1, 13.5, EASE.enter);
  c.draw(arrowPaths[1], 13.3, 13.7, EASE.enter);
  c.seg(row, { opacity: 1, transform: "translateY(0px)" }, { opacity: 0, transform: "translateY(-48px)" }, 15.8, 16.25, EASE.exit);

  // ---- Beat 5: the fuse. Lid at y 432; FUSE.lidAt = 6.5 slabs above the baseline.
  const { FUSE } = Gob.geometry;
  const BASE = LID_Y + Math.round(FUSE.lidAt * SLAB.pitch);
  const W = 520;
  const X = Math.round((1920 - W) / 2) - 120;
  const lid = c.lid("threshold");
  c.drawLid(lid, 16.1, 16.6, EASE.enter);
  const y = (i) => c.slabY(BASE, i);
  const slabs = FUSE.before.map((s, i) => {
    const el = st.slab(s.kind, { x: X, y: y(i), w: W, h: SLAB.h }, undefined, { radius: SLAB.r });
    c.seg(el, { opacity: 0, transform: "translateY(40px)" }, { opacity: 1, transform: "translateY(0px)" }, 16.3 + i * 0.07, 16.75 + i * 0.07, EASE.enter);
    return el;
  });
  // Middle five (1..5) converge on slot 3, then vanish into the summary.
  for (let i = 1; i <= 5; i++) {
    const dy = y(3) - y(i);
    c.seg(slabs[i], { transform: "translateY(0px)", opacity: 1 }, { transform: `translateY(${dy}px) scaleY(0.6)`, opacity: 0.0 }, 17.4, 18.0, EASE.fuse);
  }
  const summary = st.slab("summary", { x: X, y: y(3), w: W, h: SLAB.h }, undefined, { radius: SLAB.r });
  c.seg(summary, { opacity: 0, transform: "scaleX(0.92) scaleY(0.4)" }, { opacity: 1, transform: "scaleX(1) scaleY(1)" }, 17.6, 18.0, EASE.fuse);
  const ringHolder = c.div(`position:absolute;left:${X + W - 58}px;top:${y(3) + 9}px;width:26px;height:26px`);
  st.ring(13, 13, 26, { color: "var(--on-fill)", parent: ringHolder });
  c.seg(ringHolder, { opacity: 0, transform: "scale(0.4)" }, { opacity: 1, transform: "scale(1)" }, 18.0, 18.4, "cubic-bezier(.34,1.56,.64,1)");

  // Top three turns become the blue "recent" slabs as the stack settles.
  const recents = [6, 7, 8].map((i) => {
    const r = st.slab("recent", { x: X, y: y(i), w: W, h: SLAB.h }, undefined, { radius: SLAB.r });
    c.seg(r, { opacity: 0 }, { opacity: 1 }, 18.3, 18.7, EASE.enter);
    return r;
  });
  // Drop under the lid: summary 3→1, recents 6,7,8 → 2,3,4.
  const DROP0 = 18.6;
  const DROP1 = 19.3;
  const move = (el, from, to) => c.seg(el, { transform: "translateY(0px)" }, { transform: `translateY(${y(to) - y(from)}px)` }, DROP0, DROP1, EASE.fuse);
  move(summary, 3, 1);
  move(ringHolder, 3, 1);
  [6, 7, 8].forEach((i, k) => { move(slabs[i], i, 2 + k); move(recents[k], i, 2 + k); });

  // Head and top three pulse a blue outline once settled.
  const pulse = (i, h) => {
    const o = c.div(`position:absolute;left:${X - 6}px;top:${y(i) - 6}px;width:${W + 12}px;height:${h + 12}px;border-radius:${SLAB.r + 6}px;box-shadow:0 0 0 3px var(--tail0)`);
    c.seg(o, { opacity: 0 }, { opacity: 1 }, 19.4, 19.7, EASE.enter);
    c.seg(o, { opacity: 1 }, { opacity: 0 }, 20.1, 20.6, EASE.exit);
  };
  pulse(0, SLAB.h);
  pulse(4, 3 * SLAB.h + 2 * SLAB.gap);

  // Keys to the right of the settled stack.
  const LX = X + W + 56;
  const key = (text, yTop, h, t) => {
    const line = c.div(`position:absolute;left:${LX - 32}px;top:${yTop + h / 2}px;width:20px;height:2px;background:var(--rule)`);
    const k = c.label("small", text, { x: LX, y: yTop + h / 2 - 15, w: 560 }, { color: "var(--ink-2)" });
    c.fadeIn(line, t, { dy: 0, dur: 0.3 });
    c.fadeIn(k, t, { dx: -10, dy: 0 });
  };
  key("your task, word for word", y(0), SLAB.h, 19.5);
  key("summary of the middle", y(1), SLAB.h, 19.6);
  key("last 3 turns, word for word", y(4), 3 * SLAB.h + 2 * SLAB.gap, 19.7);
});
</script>
</body>
</html>
