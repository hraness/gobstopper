<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solved about as often</title>
</head>
<body>
<script>
// C-solved: share of 89 tasks solved per arm, Wilson 95% intervals, axis from 50%.
Gob.scene({ palette: "paper" }, (s) => {
  const { F, ARM_LABEL, ARM_STYLE, PROV, wilson } = Gob;
  const data = s.params.data.solved;
  const frame = s.still({ title: "Solved about as often", provenance: PROV.tbFull });
  const p = frame.plot;

  // The attributed reference sits under the plot, full width, apart from the axis.
  const one = (v) => v.toFixed(1);
  const reported = data.reported
    .map((r) => `${one(r.resolved_pct)} ± ${one(r.pm)}% for ${r.arm.replace(/ \(authors\)$/, "")}`);
  const box = s.el("div", `position:absolute;left:${p.x}px;width:${p.w}px;padding:18px 26px;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--rule)`);
  const body = s.text("small", `For scale only: CliffCompaction’s authors report ${reported[0]}, ${reported[1]} and ${reported[2]} (arXiv:2609.26779). Their model, host and prices differ, and we did not run these: not comparable to the rows above.`, { x: 0, y: 0 }, { parent: box, color: "var(--ink-2)" });
  body.style.position = "relative";
  const boxH = s.measure(box).height;

  const labelW = 372;
  const plotX0 = p.x;
  const plotX1 = p.x + p.w - labelW - 36;
  const x = (v) => plotX0 + ((v - 0.5) / 0.3) * (plotX1 - plotX0);
  const svg = Gob.svgLayer(s);

  const rowStep = 86;
  const rowsTop = p.y - 12;
  const axisY = rowsTop + rowStep * data.arms.length + 4;

  for (const t of [0.5, 0.6, 0.7, 0.8]) {
    const gx = Math.round(x(t)) + 0.5;
    Gob.svgNode(svg, "line", { x1: gx, x2: gx, y1: rowsTop + 8, y2: axisY, stroke: "var(--rule)", "stroke-width": 1.5 });
    Gob.svgNode(svg, "line", { x1: gx, x2: gx, y1: axisY, y2: axisY + 10, stroke: "var(--ink)", "stroke-width": 2 });
    s.text("small", `${Math.round(t * 100)}%`, { x: gx - 60, y: axisY + 16, w: 120 }, { align: "center", color: "var(--ink-2)" });
  }
  Gob.svgNode(svg, "line", { x1: plotX0, x2: plotX1, y1: axisY, y2: axisY, stroke: "var(--ink)", "stroke-width": 2 });
  s.text("small", "axis starts at 50%", { x: plotX1 + 36, y: axisY + 16, w: labelW }, { align: "right", nowrap: true, color: "var(--ink-2)" });

  data.arms.forEach((row, i) => {
    const style = ARM_STYLE[row.id];
    const [lo, hi] = wilson(row.resolved, row.n);
    const cy = rowsTop + i * rowStep + 70;
    s.text("small", ARM_LABEL[row.id], { x: plotX0, y: cy - 60 }, { nowrap: true, weight: 500 });
    Gob.svgNode(svg, "line", { x1: x(lo), x2: x(hi), y1: cy, y2: cy, stroke: style.color, "stroke-width": 3.5 });
    for (const v of [lo, hi]) Gob.svgNode(svg, "line", { x1: x(v), x2: x(v), y1: cy - 10, y2: cy + 10, stroke: style.color, "stroke-width": 3.5 });
    Gob.marker(svg, style.marker, x(row.resolved / row.n), cy, style.color, 22);
    const direct = s.text("label", `${F.solved[row.id]} of 89 · ${F.ci[row.id]}%`, { x: plotX1 + 36, y: cy - 22 }, { nowrap: true, weight: 500 });
    if (s.measure(direct).width > labelW) throw new Error(`solved: "${direct.textContent}" is wider than its ${labelW}px column`);
  });

  const pValue = data.mcnemarP >= 0.95 ? data.mcnemarP.toFixed(1) : data.mcnemarP.toFixed(2);
  const noteY = axisY + 62;
  const note = s.text("small", `The intervals overlap almost completely: no measurable difference (McNemar p = ${pValue}, tail 0 against no proxy). ${F.churn.split} of 89 tasks changed outcome between arms, the noise level of one trial.`, { x: plotX0, y: noteY, w: p.w });
  const boxY = noteY + s.measure(note).height + 18;
  if (boxY + boxH > p.y + p.h + 1) throw new Error(`solved: the reference box overflows the plot by ${boxY + boxH - p.y - p.h}px`);
  box.style.top = `${boxY}px`;
});
</script>
</body>
</html>
