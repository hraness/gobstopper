<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inside a rewritten request</title>
</head>
<body>
<script>
// D-anatomy: the rewrite as a share of the original request, block by block.
Gob.scene({ palette: "paper" }, (s) => {
  const { ANATOMY } = Gob.geometry;
  const frame = s.still({
    title: "Inside a rewritten request",
    provenance: "Tool results over 500 characters are left out. The files are still on disk, and the command can be rerun.",
  });
  const p = frame.plot;
  const W = p.w;
  const stripH = 64;
  const gap = 6;

  // The original request, as a ghost.
  const ghostY = p.y;
  const ghost = s.el("div", `position:absolute;left:${p.x}px;top:${ghostY}px;width:${W}px;height:${stripH}px;border-radius:12px;border:2px dashed color-mix(in oklab, var(--slab-edge) 70%, transparent);display:flex;align-items:center`);
  s.text("small", "original request", { x: 0, y: 0 }, { parent: ghost, color: "var(--ink-2)", weight: 500 }).style.cssText += "position:relative;padding-left:20px";

  // The rewrite, with the head and carry labels on two rows above it.
  const rowH = 40;
  const row1 = ghostY + stripH + 40;
  const row2 = row1 + rowH + 12;
  const stripY = row2 + rowH + 30;
  let x = p.x;
  const blocks = ANATOMY.blocks.map((block) => {
    const w = Math.round(block.w * W);
    const box = { x, y: stripY, w: w - gap, h: stripH };
    x += w;
    return { block, box };
  });
  const byLabel = (label) => blocks.find((b) => b.block.label === label);
  for (const { block, box } of blocks) {
    s.slab(block.kind, box, block.label === "Summary" ? "Summary" : undefined, { tone: "anatomy" });
  }
  const tick = (cx, y0, y1, color) => s.el("div", `position:absolute;left:${Math.round(cx) - 1}px;top:${y0}px;width:2px;height:${y1 - y0}px;background:${color}`);

  const head = byLabel("Head").box;
  s.text("small", "Head: system prompt and your first message, word for word", { x: head.x, y: row1 }, { nowrap: true });
  tick(head.x + 24, row1 + rowH, stripY - 6, "var(--ink)");

  const carry = byLabel("Carry").box;
  s.text("small", "Carry: earlier words and replies, up to 24,000 characters", { x: carry.x, y: row2 }, { nowrap: true });
  tick(carry.x + 24, row2 + rowH, stripY - 6, "var(--summary)");

  const last = blocks[blocks.length - 1].box;
  s.text("small", "Last 3 turns, word for word", { x: last.x + last.w + 28, y: stripY + stripH / 2 - 19 }, { color: "var(--tail0)", weight: 500, nowrap: true });

  // What a summary line looks like: invented examples.
  const sum = byLabel("Summary");
  const sc = sum.box.x + 24;
  const panelY = stripY + stripH + 34;
  tick(sc, stripY + stripH + 6, panelY, "var(--summary)");
  const panel = s.el("div", `position:absolute;left:${sum.box.x}px;top:${panelY}px;padding:22px 28px;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 1.5px color-mix(in oklab, var(--summary) 55%, transparent)`);
  for (const line of [
    "user: fix the failing test",
    "[Bash] cargo test -p app (output over 500 characters left out)",
    "assistant: the test passes now",
  ]) {
    const node = s.text("mono", line, { x: 0, y: 0 }, { parent: panel, nowrap: true });
    node.style.position = "relative";
  }
});
</script>
</body>
</html>
