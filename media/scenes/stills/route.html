<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>It sits between your agent and the provider</title>
</head>
<body>
<script>
// D-route: agent -> local proxy -> provider, and the three things the proxy can do.
Gob.scene({ palette: "paper" }, (s) => {
  const frame = s.still({
    title: "It sits between your agent and the provider",
    provenance: "Logs record sizes and counts, never request text. The proxy never edits your saved session.",
  });
  const p = frame.plot;
  const ns = "http://www.w3.org/2000/svg";
  const pillH = 92;
  const arrowW = 96;

  // Pills, measured after layout so the row centres on the plot.
  const row = s.el("div", `position:absolute;left:0;top:0;display:flex;align-items:center;gap:${arrowW}px`);
  const pill = (label, mono, strong) => {
    const node = s.el("div", `height:${pillH}px;padding:0 34px;display:flex;align-items:center;border-radius:${pillH / 2}px;white-space:nowrap;`
      + (strong ? "background:var(--panel);box-shadow:inset 0 0 0 2.5px var(--tail0)" : "background:var(--panel);box-shadow:inset 0 0 0 1.5px color-mix(in oklab, var(--slab-edge) 55%, transparent)"), row);
    const t = s.text(mono ? "mono" : "label", label, { x: 0, y: 0 }, { parent: node, weight: 500 });
    t.style.position = "relative";
    return node;
  };
  const agent = pill("Claude Code", false, false);
  const proxy = pill("gobstopper proxy · 127.0.0.1:8260", true, true);
  const provider = pill("model provider", false, false);
  const rowW = s.measure(row).width;
  const rowX = Math.round(p.x + (p.w - rowW) / 2);
  const firstGap = 118;
  const stepY = 118;
  // Pills, trunk and three outcomes as one block, centred a little above the plot's middle.
  const blockH = pillH + firstGap + stepY * 2 + 24;
  const rowY = Math.round(p.y + (p.h - blockH) / 2 - p.h * 0.04);
  row.style.left = `${rowX}px`;
  row.style.top = `${rowY}px`;
  const cy = rowY + pillH / 2;
  const box = (node) => {
    const r = s.measure(node);
    return { x: r.x, y: r.y, w: r.width, h: r.height };
  };
  const a = box(agent), b = box(proxy), c = box(provider);

  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("width", String(s.width));
  svg.setAttribute("height", String(s.height));
  svg.style.cssText = "position:absolute;left:0;top:0;overflow:visible";
  s.root.appendChild(svg);
  const path = (d, color, width = 2.5) => {
    const node = document.createElementNS(ns, "path");
    node.setAttribute("d", d);
    node.setAttribute("fill", "none");
    node.setAttribute("stroke", color);
    node.setAttribute("stroke-width", String(width));
    node.setAttribute("stroke-linecap", "round");
    node.setAttribute("stroke-linejoin", "round");
    svg.appendChild(node);
    return node;
  };
  const arrow = (x0, x1, y) => {
    path(`M${x0 + 16},${y} H${x1 - 18}`, "var(--ink)");
    path(`M${x1 - 28},${y - 9} L${x1 - 17},${y} L${x1 - 28},${y + 9}`, "var(--ink)");
  };
  arrow(a.x + a.w, b.x, cy);
  arrow(b.x + b.w, c.x, cy);

  // Three outcomes under the proxy pill, joined by one trunk.
  const trunkX = b.x + 64;
  const firstY = rowY + pillH + firstGap;
  const outcomes = [
    { text: "under the threshold: sent unchanged", color: "var(--slab-edge)", glyph: "slab" },
    { text: "over the threshold: rewritten", color: "var(--tail0)", glyph: "ring" },
    { text: "anything goes wrong: your original request is sent", color: "var(--ink)", glyph: "back" },
  ];
  const lastY = firstY + stepY * (outcomes.length - 1);
  path(`M${trunkX},${rowY + pillH} V${lastY - 18}`, "var(--ink)");
  outcomes.forEach((o, i) => {
    const y = firstY + i * stepY;
    const r = 18;
    const elbow = i === outcomes.length - 1
      ? `M${trunkX},${y - r} Q${trunkX},${y} ${trunkX + r},${y} H${trunkX + 88}`
      : `M${trunkX},${y} H${trunkX + 88}`;
    path(elbow, "var(--ink)");
    const gx = trunkX + 88 + 30;
    if (o.glyph === "slab") {
      s.slab("turn", { x: gx - 22, y: y - 15, w: 44, h: 30 }, undefined, { radius: 7 });
    } else if (o.glyph === "ring") {
      s.ring(gx, y, 38, { color: o.color, stroke: 2.2 });
    } else {
      const g = s.el("div", `position:absolute;left:${gx - 22}px;top:${y - 15}px;width:44px;height:30px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--ink);background:var(--panel)`);
      void g;
    }
    s.text("label", o.text, { x: gx + 44, y: y - 22 }, { nowrap: true, color: i === 1 ? "var(--tail0)" : "var(--ink)", weight: i === 1 ? 500 : 400 });
  });
});
</script>
</body>
</html>
