# ~/.config/gobstopper/config.toml

[policy]
strategy = "auto"              # auto | sawtooth | cache_edits | elide | compacted | cache_aware | scored | dedupe | micro | middle | structured | agentic
trigger_tokens = 250_000       # fire when context exceeds this
floor_tokens = 40_000          # transcript-path post-compaction target
keep_recent_tool_outputs = 8   # tail outputs never elided
min_interval_secs = 300        # per-session compaction rate limit
min_savings_tokens = 4_096     # reject plans that reclaim less
# adaptive = true              # derive trigger/floor per session from the
                               # provider window, elidable share, and past
                               # compaction yields; see `gobstopper tune`

# Per-provider overrides
[provider.codex]
# trigger_tokens = 200_000
# auto_compact_closed = true    # watch runs `thread/compact` on idle
                               # over-trigger threads via `codex app-server`
                               # (provider's own compactor). Sub-agent
                               # threads can't be resumed and are skipped.

[provider.claude_code]
# trigger_tokens = 180_000
# auto_apply_inplace = true    # watch rewrites idle transcripts in place
# auto_compact_closed = true   # watch runs `claude --resume <id> -p /compact`
                               # on closed over-trigger sessions; a failure
                               # leaves the session unchanged
# block_tokens = 500_000       # hard ceiling: the prompt-policy hook returns
                               # decision:block at/above this context size
                               # (treatment cohort only; 0 disables)

[provider.devin]
# Live sessions get `/compact`; `gobstopper apply` compacts idle ones in place.
# watch writes to Devin sessions only with one of the settings below.
# trigger_tokens = 200_000
# auto_compact_closed = true    # watch runs `devin acp` session/load +
                               # /compact on idle over-trigger sessions
                               # (provider's own file_compactor); a failure
                               # leaves the session unchanged
# auto_apply_store = true       # guarded in-place sessions.db elision on
                               # idle sessions; not used as a fallback when
                               # auto_compact_closed is on

# Per-session overrides, keyed by session id
# [sessions."01a08d7c-77fd-7690-9413-e8219b379151"]
# strategy = "structured"
# trigger_tokens = 120_000

# Named presets: `gobstopper plan <s> --preset deep-work`
[presets.deep-work]
strategy = "elide"
trigger_tokens = 150_000
floor_tokens = 20_000

[presets.chatty]
strategy = "structured"
trigger_tokens = 180_000

# Elide stale outputs and inject a state card. A synthetic Codex `compacted`
# record additionally needs `gobstopper apply --experimental-compacted`.
[presets.compact-window]
strategy = "compacted"
trigger_tokens = 120_000
floor_tokens = 20_000

# Userspace code preset: receives the normalized transcript as JSON on
# stdin, returns {"edits": [...]} on stdout.
# [presets.my-script]
# command = "python3 ~/bin/compactor.py"
# trusted_legacy_command = true

# Agentic preset backed by the compatibility package in the xcb repository:
# a cheap model emits keep/elide/summarize/defer calls and the shim
# lowers them to Edit[]. Requires an Anthropic API key (see hraness/xcb).
# [presets.xcb-editor]
# strategy = "agentic"
# command = "bun /path/to/xcb/src/gobstopper-editor.ts"
# trusted_legacy_command = true
