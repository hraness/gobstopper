[workspace]
resolver = "2"
members = [
    "crates/gobstopper-core",
    "crates/gobstopper-adapters",
    "crates/gobstopper-cli",
]

[workspace.package]
version = "0.8.6"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hraness/gobstopper"
rust-version = "1.85"

[workspace.dependencies]
gobstopper-core = { path = "crates/gobstopper-core", version = "=0.8.6" }
gobstopper-adapters = { path = "crates/gobstopper-adapters", version = "=0.8.6" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
toml = "0.8"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
