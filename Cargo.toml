[workspace]
resolver = "2"
members = [
    "crates/gobstopper-core",
    "crates/gobstopper-adapters",
    "crates/gobstopper-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hraness/gobstopper"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
