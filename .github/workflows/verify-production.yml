name: Production public site browser
# Runs after every successful Vercel Production deployment, and on demand.
# Preview deployments also send deployment_status; every job here skips them.
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
# One live check at a time; a newer deployment queues behind the running one
# instead of cancelling it. Only Production-success and manual runs share the
# group, so a Preview or non-success event cannot replace a queued live check.
concurrency:
  group: production-public-browser-${{ (github.event_name == 'workflow_dispatch' || (github.event.deployment.environment == 'Production' && github.event.deployment_status.state == 'success')) && 'live' || github.run_id }}
  cancel-in-progress: false
jobs:
  browser:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Same key as CI's site job; only CI on main saves it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-site-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-site-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.61.1
      - name: Provision locked Chromium
        run: bunx --no-install playwright-core install --with-deps chromium
      # The check reads gobstopper.sh, whose alias can trail the deployment's
      # success event by a few seconds; retry twice before failing.
      - name: Verify the live public routes
        run: |
          for attempt in 1 2 3; do
            bun run check:public-site:browser --production && exit 0
            test "$attempt" = 3 || { echo "attempt $attempt failed; retrying in 30s"; sleep 30; }
          done
          exit 1
      - name: Save public page screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-public-site-browser
          path: site/.impeccable/review/public-*
          include-hidden-files: true
          retention-days: 7
  # Not named "Required": that context is the main ruleset's merge gate, and
  # a deployment_status run for a PR head must never post it.
  production-gate:
    name: Production browser
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment == 'Production'))
    needs: browser
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require live browser verification
        env:
          RESULT: ${{ needs.browser.result }}
        run: test "$RESULT" = success
