name: Production public site browser
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-public-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify the live public routes
        env:
          GOBSTOPPER_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: bun run check:public-site:browser --production
      - name: Save public page screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-public-site-browser
          path: site/.impeccable/review/public-*
          include-hidden-files: true
          retention-days: 7
  required:
    name: Required
    if: always()
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require live browser verification
        env:
          RESULT: ${{ needs.browser.result }}
        run: test "$RESULT" = success
