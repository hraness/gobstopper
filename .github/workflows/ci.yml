name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --doc --all-features --locked
      - run: python3 scripts/check_assurance.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  msrv:
    name: MSRV 1.85.0
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: msrv
      - run: cargo check --workspace --lib --bins --locked

  formal:
    name: Vault protocol model
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch pinned TLC and check protocol plus negative controls
        run: |
          curl --fail --location --retry 2 --max-time 60 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output "$RUNNER_TEMP/tla2tools.jar"
          python3 verify/vault/check.py --java java \
            --tlc-jar "$RUNNER_TEMP/tla2tools.jar" \
            --output "$RUNNER_TEMP/vault-model-evidence"
      - name: Report exact verification receipt
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/vault-model-evidence/receipt.json"; then
            cat "$RUNNER_TEMP/vault-model-evidence/receipt.json"
          fi
          for log in "$RUNNER_TEMP"/vault-model-evidence/*.log; do
            if test -f "$log"; then
              cat "$log"
            fi
          done

  required:
    name: Required
    if: always()
    needs: [quality, msrv, formal]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification gate
        env:
          QUALITY: ${{ needs.quality.result }}
          MSRV: ${{ needs.msrv.result }}
          FORMAL: ${{ needs.formal.result }}
        run: test "$QUALITY" = success && test "$MSRV" = success && test "$FORMAL" = success
