name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '19 7 * * 1'

permissions:
  contents: read

# Pull requests cancel superseded runs; main, schedule and dispatch runs are
# grouped per commit and never cancelled by a later run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests skip gates their files cannot affect. Both filters are
  # negative, so a new top-level path runs everything. Pushes, schedules and
  # dispatches always run every gate (release evidence cites push runs).
  changes:
    name: Changed areas
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.benchmarks == 'true' }}
      site: ${{ github.event_name != 'pull_request' || steps.filter.outputs.site == 'true' || steps.filter.outputs.installers == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            rust:
              - '**'
              - '!site/**'
              - '!media/**'
            benchmarks:
              - 'site/public/benchmarks/**'
            site:
              - '**'
              - '!crates/**'
              - '!verify/**'
              - '!hf/**'
              - '!scripts/**'
              - '!Cargo.lock'
            # The site serves the installers, so they run the site gate too.
            # One pattern: every filter here must match all of its patterns.
            installers:
              - 'scripts/install.{sh,ps1}'

  quality:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: rust-1.97.1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.146
      # One process per test: wait-bound suites overlap instead of running
      # binary after binary. Doctests stay on cargo test below.
      - run: cargo nextest run --workspace --all-targets --all-features --locked --profile ci
      - run: cargo test --workspace --doc --all-features --locked
      - run: python3 scripts/check-dialects.py --cases 512 --seed 78422376057123

  # The Python gates need no Rust build, so they run beside quality instead
  # of after its test step.
  python:
    name: Assurance and Python checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/check_assurance.py
      - name: Validate public benchmark export
        run: |
          python3 hf/stage.py
          python3 -m unittest discover -s hf -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python3 -m unittest discover -s verify -p 'test_tools.py' -v
      - run: python3 -m unittest discover -s verify/vault -p 'test_*.py' -v
      - run: python3 -m unittest discover -s verify/watch -p 'test_*.py' -v
      - run: python3 -m unittest discover -s verify/core -p 'test_*.py' -v
      - run: python3 -m unittest discover -s verify/transcript -p 'test_*.py' -v
      - run: python3 -m unittest discover -s verify/stress -p 'test_*.py' -v

  # Windows x86_64 is a release platform: build and run the workspace tests
  # there too. Unix-only features refuse at run time; see docs/release.md.
  windows:
    name: Windows build and tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      # Keep LF line endings so embedded fixtures hash the same as on Unix.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: windows-rust-1.97.1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.146
      # The windows profile skips the tests of Unix-only features; see
      # .config/nextest.toml.
      - run: cargo nextest run --workspace --all-targets --all-features --locked --profile windows
      # Package the debug binary the tests built exactly as a release does,
      # then install it with scripts/install.ps1 from a loopback server.
      - name: Package and install with the hosted installer
        shell: pwsh
        run: |
          $env:GOBSTOPPER_BINARY = (Resolve-Path 'target\debug\gobstopper.exe').Path
          ./scripts/build-release.ps1
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'artifacts' -PassThru -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(60)
          while ($true) {
            try { Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/' -TimeoutSec 2 | Out-Null; break }
            catch { if ((Get-Date) -gt $deadline) { throw 'the loopback release server did not start' }; Start-Sleep -Milliseconds 250 }
          }
          $version = ((& $env:GOBSTOPPER_BINARY --version) | Out-String).Trim().Split(' ')[1]
          $prefix = Join-Path $env:RUNNER_TEMP 'install-check'
          $env:GOBSTOPPER_VERSION = $version
          $env:GOBSTOPPER_RELEASE_BASE_URL = 'http://127.0.0.1:8765'
          $env:GOBSTOPPER_INSTALL_PREFIX = $prefix
          $env:GOBSTOPPER_ADD_PATH = 'no'
          try { & ./scripts/install.ps1 } finally { Stop-Process -Id $server.Id -Force }
          $reported = ((& (Join-Path $prefix 'bin\gobstopper.exe') --version) | Out-String).Trim()
          if ($reported -cne "gobstopper $version") { throw "installed binary reports '$reported'" }

  macos-signing:
    name: macOS signing parser
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Copies and ad-hoc-signs a disposable system executable. No payload is
      # executed and no certificate, keychain, or service credential is used.
      - run: python3 scripts/test_sign_macos_release.py NativeRequirementParserTests -v

  msrv:
    name: MSRV 1.85.0
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --lib --bins --locked

  formal:
    name: Vault and native protocol models
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch checksum-pinned Java and TLC
        run: |
          python3 verify/tools.py java --output "$RUNNER_TEMP/java.tar.gz" > "$RUNNER_TEMP/java-pin.json"
          python3 verify/tools.py tlc --output "$RUNNER_TEMP/tla2tools.jar" > "$RUNNER_TEMP/tlc-pin.json"
          mkdir "$RUNNER_TEMP/java"
          tar -xzf "$RUNNER_TEMP/java.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/java"
      - name: Check custody and publication plus negative controls
        run: |
          python3 verify/vault/check.py --java "$RUNNER_TEMP/java/bin/java" \
            --tlc-jar "$RUNNER_TEMP/tla2tools.jar" \
            --output "$RUNNER_TEMP/vault-model-evidence"
      - name: Check native dispatch plus negative controls
        run: |
          python3 verify/watch/check.py --java "$RUNNER_TEMP/java/bin/java" \
            --tlc-jar "$RUNNER_TEMP/tla2tools.jar" \
            --output "$RUNNER_TEMP/watch-model-evidence"
      - name: Retain complete protocol evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protocol-evidence-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/*-pin.json
            ${{ runner.temp }}/*-model-evidence/*.json
            ${{ runner.temp }}/*-model-evidence/*.log

  core-proofs:
    name: Production Rust proof kernels
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
      - name: Install pinned Kani and its exact compiler bundle
        run: |
          python3 verify/tools.py kani --output "$RUNNER_TEMP/kani.tar.gz" > "$RUNNER_TEMP/kani-pin.json"
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup --use-local-bundle "$RUNNER_TEMP/kani.tar.gz"
          cargo fetch --locked
      - name: Prove production kernels and reject the exact boundary mutant
        run: python3 verify/core/check.py --kani "$HOME/.cargo/bin/cargo-kani" --output "$RUNNER_TEMP/core-evidence"
      - name: Retain complete proof reports, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-proof-evidence-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/kani-pin.json
            ${{ runner.temp }}/core-evidence/*.json
            ${{ runner.temp }}/core-evidence/*.log

  transcript-proofs:
    name: Lean laws and Rust correspondence
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
      - name: Fetch checksum-pinned Lean
        run: |
          python3 verify/tools.py lean --output "$RUNNER_TEMP/lean.tar.zst" > "$RUNNER_TEMP/lean-pin.json"
          mkdir "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/lean"
          cargo fetch --locked
      - name: Prepare the Rust correspondence build and nested engine cache
        run: cargo test -p gobstopper-adapters --test lean_correspondence --locked --no-run --jobs 2
      - name: Prove algebra, audit axioms, and reject correspondence mutants
        run: python3 verify/transcript/check.py --lake "$RUNNER_TEMP/lean/bin/lake" --output "$RUNNER_TEMP/transcript-evidence"
      - name: Retain complete proof and correspondence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: transcript-proof-evidence-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/lean-pin.json
            ${{ runner.temp }}/transcript-evidence/*.json
            ${{ runner.temp }}/transcript-evidence/*.log

  bounded-stress:
    name: Bounded fault and process suites
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: rust-1.97.1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare dependencies and test binaries within the job deadline
        run: cargo test --workspace --all-targets --locked --no-run --jobs 2
      - name: Run exact named suites with bounded resources
        run: python3 verify/stress/check.py --output "$RUNNER_TEMP/stress-evidence"
      - name: Retain bounded workload evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stress-evidence-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/stress-evidence/*.json
            ${{ runner.temp }}/stress-evidence/*.log

  site:
    name: Public site build and browser
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Only main saves caches; pull requests and branch dispatches restore. The Next.js
      # build cache is keyed per commit so each main build refreshes it.
      - name: Restore Bun cache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-site-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-site-${{ runner.os }}-
      - name: Bun cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-site-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-site-${{ runner.os }}-
      - name: Restore Next.js build cache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.next/cache
          key: next-site-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}-${{ github.sha }}
          restore-keys: next-site-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}-
      - name: Next.js build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.next/cache
          key: next-site-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}-${{ github.sha }}
          restore-keys: next-site-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check the launch stills against their receipts
        working-directory: .
        run: bun test media/stills.test.ts
      - name: Check the launch film shot list and scene runtime copies
        working-directory: .
        run: bun test media/film.test.ts && bun media/scenes/film/sync.ts --check
      - name: Run the complete site gate and production build
        run: bun run check
      - name: Restore pinned browser cache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.61.1
      - name: Pinned browser cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.61.1
      - name: Provision locked Chromium
        run: bunx --no-install playwright-core install --with-deps chromium
      - name: Verify public routes and appearance
        run: bun run check:public-site:browser
      - name: Retain screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-site-browser
          path: site/.impeccable/review/public-*
          include-hidden-files: true
          retention-days: 7

  required:
    name: Required
    if: always()
    needs: [changes, quality, windows, python, macos-signing, msrv, formal, core-proofs, transcript-proofs, bounded-stress, site]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # A gate may be skipped only when the change filter ruled its area out.
      - name: Require every verification gate
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.changes.outputs.rust }}
          SITE_CHANGED: ${{ needs.changes.outputs.site }}
          SITE: ${{ needs.site.result }}
          QUALITY: ${{ needs.quality.result }}
          WINDOWS: ${{ needs.windows.result }}
          PYTHON: ${{ needs.python.result }}
          MACOS_SIGNING: ${{ needs.macos-signing.result }}
          MSRV: ${{ needs.msrv.result }}
          FORMAL: ${{ needs.formal.result }}
          CORE_PROOFS: ${{ needs.core-proofs.result }}
          TRANSCRIPT_PROOFS: ${{ needs.transcript-proofs.result }}
          BOUNDED_STRESS: ${{ needs.bounded-stress.result }}
        run: |
          gate() { test "$1" = success || { test "$1" = skipped && test "$2" = false; }; }
          test "$CHANGES" = success
          gate "$SITE" "$SITE_CHANGED"
          for result in "$QUALITY" "$WINDOWS" "$PYTHON" "$MACOS_SIGNING" "$MSRV" "$FORMAL" "$CORE_PROOFS" "$TRANSCRIPT_PROOFS" "$BOUNDED_STRESS"; do
            gate "$result" "$RUST"
          done
