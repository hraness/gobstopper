[package]
name = "gobstopper"
description = "Automatic context compaction for Codex and Claude Code sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gobstopper"
path = "src/main.rs"

[dependencies]
gobstopper-core = { path = "../gobstopper-core" }
gobstopper-adapters = { path = "../gobstopper-adapters" }
apple-foundation = { git = "https://github.com/hraness/apple-foundation", tag = "v0.1.2" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
keyring = "4.1.6"
