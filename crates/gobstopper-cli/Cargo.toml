[package]
name = "gobstopper"
description = "Inspects Claude Code and Codex sessions and prepares compacted transcript copies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gobstopper"
path = "src/main.rs"

[dependencies]
gobstopper-core = { workspace = true }
gobstopper-adapters = { workspace = true }
apple-foundation = { git = "https://github.com/hraness/apple-foundation", tag = "v0.2.0", version = "=0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
keyring = { version = "3.6.2", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
libc = "0.2"
hraness-cli-kit = { git = "https://github.com/hraness/desktop-foundation", tag = "v1.1.2", version = "=1.1.2", features = ["clap"] }
hraness-cli-update = { git = "https://github.com/hraness/cli-update", tag = "v0.1.0", version = "=0.1.0" }

[dev-dependencies]
