[package]
name = "gobstopper"
description = "Inspects Claude Code and Codex sessions and prepares compacted transcript copies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gobstopper"
path = "src/main.rs"

[dependencies]
gobstopper-core = { path = "../gobstopper-core" }
gobstopper-adapters = { path = "../gobstopper-adapters" }
apple-foundation = { git = "https://github.com/hraness/apple-foundation", tag = "v0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
keyring = { version = "3.6.2", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
libc = "0.2"
hraness-cli-kit = { git = "https://github.com/hraness/desktop-foundation", tag = "v0.8.1", features = ["clap"] }

[dev-dependencies]
