        test(=apple::tests::bounded_bridge_rejects_malformed_flood_hang_and_private_errors)
      | test(=apple::tests::model_unavailable_keeps_its_reason_and_nothing_else)
      | test(=apple_cmd::tests::status_and_install_match_golden)
      | test(=apple_scorer::tests::invalid_generation_never_populates_score_cache)
      | test(=config::tests::inspection_rejects_external_strategies_without_loading_them)
      | test(=hooks::tests::advisory_throttle_suppresses_repeat_until_growth_or_age)
      | test(=hooks::tests::callbacks_require_exact_source_identity_and_do_not_pair_foreign_archives)
      | test(=hooks::tests::handle_precompact_snapshots_and_logs)
      | test(=hooks::tests::handle_session_start_compact_returns_context)
