      | test(=vault::tests::identical_content_dedups_object_but_appends_index)
      | test(=vault::tests::latest_for_returns_newest_snapshot)
      | test(=vault::tests::legacy_provider_labels_in_index_stay_readable)
      | test(=vault::tests::legacy_reads_and_dry_run_create_no_control_files)
      | test(=vault::tests::list_is_newest_first_and_rejects_incomplete_history)
      | test(=vault::tests::prune_keeps_last_appended_snapshot_when_timestamps_tie)
      | test(=vault::tests::prune_keeps_newest_per_stream_and_drops_unreachable_objects)
      | test(=vault::tests::prune_preserves_a_manifest_shared_by_kept_and_dropped_entries)
      | test(=vault::tests::prune_refuses_corrupt_retained_manifest_without_deleting_anything)
