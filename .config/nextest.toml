      | test(=native_operations::tests::failed_dispatch_persistence_never_authorizes_a_provider_call)
      | test(=native_operations::tests::independent_openers_share_custody_until_owner_releases)
      | test(=native_operations::tests::journal_accepts_terminal_history_but_rejects_uncertain_replay)
      | test(=native_operations::tests::journal_rejects_fabricated_success_reconciliation_and_identity_changes)
      | test(=native_operations::tests::persistence_faults_at_every_record_state_leave_old_complete_or_repair_state)
      | test(=native_operations::tests::registry_preserves_target_binding_after_rename_or_missing_file)
      | test(=telemetry::tests::provenance_records_actual_gate_and_frozen_configuration)
      | test(=tests::codex_compact_bounds_frames_and_treats_lost_ack_as_unknown)
      | test(=tests::codex_compact_classifies_structural_failures_without_echoing_provider_text)
      | test(=tests::codex_compact_initializes_resumes_then_compacts)
      | test(=tests::codex_compact_observes_completion_before_dispatch_ack)
      | test(=tests::codex_compact_propagates_request_errors)
      | test(=tests::codex_compact_reports_failed_turn_as_error)
      | test(=tests::codex_compact_requires_the_compaction_items_terminal_turn)
      | test(=tests::codex_terminal_order_duplicates_and_ambiguity_are_explicit)
      | test(=tests::preset_command_edits_flow_into_a_plan)
      | test(=tests::preset_command_empty_edits_defers_without_a_plan)
