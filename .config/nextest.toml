      | test(=claude::tests::unlinked_attachments_preserve_valid_graph_and_discovery_usage)
      | test(=claude::tests::usage_scan_enforces_total_record_and_count_limits)
      | test(=detect::tests::quiet_live_claude_session_survives_age_filter_without_scanning_old_usage)
      | test(=fork::tests::claude_fork_refuses_existing_target)
