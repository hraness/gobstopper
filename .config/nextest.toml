  | (binary_id(gobstopper-adapters::measurement) & (
        test(=ambiguous_graphs_cannot_export_additive_session_totals)
      | test(=complete_claude_projection_and_cumulative_codex_tail_totals_are_full)
    ))
  | (binary_id(gobstopper-adapters::surgery_hegel) & (
        test(=fork_is_additive_and_linkage_preserving)
      | test(=scan_usage_agrees_with_load)
      | test(=surgery_preserves_linkage_and_verify_clean)
